
name: PlatformIO Library Release

on:
  workflow_call:
    secrets:
      PLATFORMIO_AUTH_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout library
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Validate versions
        id: version
        shell: bash
        run: |
          JSON_VERSION=$(python -c "import json; print(json.load(open('library.json'))['version'])")
          PROPERTIES_VERSION=$(grep '^version=' library.properties | cut -d= -f2)

          if [ "$JSON_VERSION" != "$PROPERTIES_VERSION" ]; then
            echo "Version mismatch!"
            echo "library.json: $JSON_VERSION"
            echo "library.properties: $PROPERTIES_VERSION"
            exit 1
          fi

          echo "version=$JSON_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$JSON_VERSION" >> "$GITHUB_OUTPUT"

      - name: Package library
        run: pio pkg pack --output /tmp/library.tar.gz

      - name: Publish to PlatformIO
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PLATFORMIO_AUTH_TOKEN" ]; then
            echo "Missing PlatformIO token"
            exit 1
          fi

          pio pkg publish /tmp/library.tar.gz --no-interactive

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
